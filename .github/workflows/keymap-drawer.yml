name: Draw Keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/keymap.keymap"
      - "config/info.json"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/keymap-drawer.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: |
          pip install keymap-drawer

      - name: Parse ZMK keymap
        run: |
          keymap parse \
            -c keymap_drawer.config.yaml \
            -z config/keymap.keymap \
            -o keymap.yaml

      - name: Draw SVG
        run: |
          keymap draw \
            -c keymap_drawer.config.yaml \
            -j config/info.json \
            keymap.yaml \
            -o Torabo-tuki.svg

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keymap.yaml Torabo-tuki.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Torabo-tuki keymap SVG"
            git push
          fi
